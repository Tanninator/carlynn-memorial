<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Carli Wu</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #0a1422; --navy: #0f1d31; --navy-2: #16263e; --navy-line: #1f3251;
    --brass: #c89968; --brass-deep: #a87a4a; --brass-light: #e2c089;
    --ivory: #f3ead7; --ivory-soft: #d8cdb4; --muted: #8a8068;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--navy-deep);
    color: var(--ivory);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: var(--brass-light); text-decoration: none; }

  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,20,34,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--navy-line); }
  .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; }
  .crest { display: flex; align-items: center; gap: 14px; }
  .crest-mark { width: 34px; height: 34px; border: 1px solid var(--brass); display: grid; place-items: center; color: var(--brass-light); font-family: "Cormorant Garamond", serif; font-size: 16px; }
  .crest-text small { display: block; color: var(--brass); font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase; }
  .crest-text strong { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 17px; letter-spacing: 0.04em; }
  nav.links { display: flex; gap: 28px; }
  nav.links a { color: var(--ivory-soft); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; }
  nav.links a:hover { color: var(--brass-light); }
  nav.links a[aria-current="page"] { color: var(--brass-light); }
  .nav-toggle { display: none; }
  .topbar-inner { position: relative; z-index: 100; }
  .topbar-right { display: flex; align-items: center; gap: 28px; }
  .rsvp-open { display: inline-flex; align-items: center; padding: 9px 24px; cursor: pointer; background: var(--brass); color: var(--navy-deep); border: 1px solid var(--brass); font-family: "Inter", system-ui, sans-serif; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 600; text-decoration: none; transition: filter 0.2s ease, transform 0.2s ease; }
  .rsvp-open:hover { filter: brightness(1.07); transform: translateY(-1px); color: var(--navy-deep); }
  @media (max-width: 760px) {
    nav.links { display: none; }
    nav.links.open {
      display: flex; flex-direction: column; gap: 0;
      position: absolute; top: calc(100% + 1px); right: 32px;
      min-width: 210px; padding: 6px 0;
      background: var(--navy); border: 1px solid var(--navy-line);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55); z-index: 60;
    }
    nav.links.open a { padding: 13px 22px; font-size: 12px; letter-spacing: 0.22em; }
    nav.links.open a[aria-current="page"] { background: rgba(200,153,104,0.10); }
    .nav-toggle {
      display: inline-block; box-sizing: border-box;
      width: 44px; height: 38px; padding: 10px 11px; margin-right: 16px;
      background: transparent; border: 1px solid var(--brass); cursor: pointer;
    }
    .nav-toggle span { display: block; width: 100%; height: 2px; background: var(--brass-light); transition: transform 0.25s ease, opacity 0.2s ease; }
    .nav-toggle span + span { margin-top: 5px; }
    .nav-toggle.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.is-open span:nth-child(2) { opacity: 0; }
    .nav-toggle.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .topbar-right { gap: 0; }
  }

  .head { max-width: 1280px; margin: 0 auto; padding: 80px 32px 40px; }
  .ribbon { display: inline-flex; align-items: center; gap: 14px; color: var(--brass); font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; margin-bottom: 18px; }
  .ribbon::before, .ribbon::after { content: ""; width: 40px; height: 1px; background: var(--brass); }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: clamp(40px, 6vw, 72px); line-height: 1.05; letter-spacing: -0.01em; margin: 0 0 14px; color: var(--ivory); }
  h1 em { font-style: italic; color: var(--brass-light); font-weight: 400; }
  .head p { color: var(--ivory-soft); max-width: 560px; line-height: 1.6; margin: 0; font-size: 15px; }

  .gal-section { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  .gal-section:last-of-type { padding-bottom: 40px; }
  .sec-head { display: flex; align-items: baseline; gap: 16px; padding: 44px 0 4px; border-bottom: 1px solid var(--navy-line); margin-bottom: 24px; }
  .sec-head h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -0.01em; margin: 0; color: var(--ivory); }
  .sec-head h2 em { font-style: italic; color: var(--brass-light); font-weight: 400; }
  .sec-head .count { color: var(--brass); font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--navy-2);
    border: 1px solid var(--navy-line);
    overflow: hidden;
    cursor: zoom-in;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .cell:hover { transform: translateY(-2px); border-color: var(--brass); }
  .cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .cell img.loaded { opacity: 1; }

  .empty { max-width: 1280px; margin: 0 auto; padding: 40px 32px 120px; color: var(--muted); font-style: italic; text-align: center; font-family: "Cormorant Garamond", serif; font-size: 18px; }

  /* lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(8, 14, 22, 0.94);
    display: none;
    align-items: center; justify-content: center;
    padding: 32px;
    cursor: zoom-out;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  .lb-close, .lb-prev, .lb-next {
    position: absolute; background: transparent; color: var(--brass-light);
    border: 1px solid var(--brass); cursor: pointer;
    font-family: inherit; font-size: 18px;
    width: 48px; height: 48px;
    display: grid; place-items: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover { background: var(--brass); color: var(--navy-deep); }
  .lb-close { top: 24px; right: 24px; }
  .lb-prev { left: 24px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 24px; top: 50%; transform: translateY(-50%); }
  .lb-counter { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); color: var(--ivory-soft); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; }
  @media (max-width: 600px) {
    .lb-prev, .lb-next { width: 40px; height: 40px; }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    .lb-close { top: 16px; right: 16px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="crest">
      <div class="crest-mark">CW</div>
      <div class="crest-text"><small>In Loving Memory</small><strong>Carli Wu</strong></div>
    </div>
    <div class="topbar-right">
    <nav class="links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="story.html">Her Story</a>
      <a href="service.html">Service</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="grief-resources.html">Grief Resources</a>
      <a href="index.html#lanterns">Lanterns</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-controls="nav-links" aria-expanded="false"><span></span><span></span><span></span></button>
    <a href="index.html#rsvp" class="rsvp-open rsvp-top">RSVP</a>
    </div>
  </div>
</header>

<section class="head">
  <div class="ribbon">Gallery</div>
  <h1>Her life, <em>in pictures</em></h1>
  <p>Moments with Carli, and a gallery of her own paintings. Click any image to view full size.</p>
</section>

<section id="sec-photos" class="gal-section" hidden>
  <div class="sec-head"><h2>Moments with <em>Carli</em></h2><span class="count" id="count-photos"></span></div>
  <div id="grid-photos" class="grid"></div>
</section>

<section id="sec-art" class="gal-section" hidden>
  <div class="sec-head"><h2>Her <em>artwork</em></h2><span class="count" id="count-art"></span></div>
  <div id="grid-art" class="grid"></div>
</section>

<div id="empty" class="empty" hidden>Photos will appear here as the family adds them.</div>

<div id="lb" class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" type="button" aria-label="Close">✕</button>
  <button class="lb-prev" type="button" aria-label="Previous">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-next" type="button" aria-label="Next">›</button>
  <div id="lb-counter" class="lb-counter"></div>
</div>

<script>
(function () {
  const empty = document.getElementById("empty");
  const lb = document.getElementById("lb");
  const lbImg = document.getElementById("lb-img");
  const lbCounter = document.getElementById("lb-counter");

  let photos = [];
  let lbIndex = -1;

  function srcFor(name) { return name.indexOf("/") >= 0 ? name : "assets/gallery/" + name; }

  function makeCell(photo, idx) {
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cell";
    cell.setAttribute("aria-label", "Open photo " + (idx + 1));
    cell.dataset.index = idx;
    const img = document.createElement("img");
    img.src = srcFor(photo.thumb || photo.src);
    img.alt = photo.alt || "";
    img.loading = "lazy";
    img.decoding = "async";
    img.addEventListener("load", () => img.classList.add("loaded"));
    cell.appendChild(img);
    cell.addEventListener("click", () => openLightbox(idx));
    return cell;
  }

  // Renders one category's photos into its grid; reveals the section only if it has any.
  function renderSection(sectionId, gridId, countId, items) {
    if (!items.length) return;
    const grid = document.getElementById(gridId);
    const frag = document.createDocumentFragment();
    items.forEach(item => frag.appendChild(makeCell(item, item._index)));
    grid.appendChild(frag);
    document.getElementById(countId).textContent =
      items.length + (items.length === 1 ? " image" : " images");
    document.getElementById(sectionId).hidden = false;
  }

  function openLightbox(i) {
    lbIndex = i;
    lbImg.src = srcFor(photos[i].src);
    lbImg.alt = photos[i].alt || "";
    lbCounter.textContent = (i + 1) + " / " + photos.length;
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
    lbImg.src = "";
    lbIndex = -1;
  }
  function step(delta) {
    if (lbIndex < 0) return;
    const next = (lbIndex + delta + photos.length) % photos.length;
    openLightbox(next);
  }

  lb.addEventListener("click", (e) => {
    if (e.target === lb || e.target === lbImg) closeLightbox();
  });
  lb.querySelector(".lb-close").addEventListener("click", closeLightbox);
  lb.querySelector(".lb-prev").addEventListener("click", (e) => { e.stopPropagation(); step(-1); });
  lb.querySelector(".lb-next").addEventListener("click", (e) => { e.stopPropagation(); step(1); });
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });

  fetch("assets/gallery/photos.json")
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      const items = (list || []).map(item => typeof item === "string" ? { src: item } : item);
      const artGroup = items.filter(p => p.category === "art");
      const photoGroup = items.filter(p => p.category !== "art");
      // Combined order drives the lightbox: photographs first, then artwork.
      photos = photoGroup.concat(artGroup);
      photos.forEach((p, i) => { p._index = i; });

      if (!photos.length) {
        empty.hidden = false;
        return;
      }
      renderSection("sec-photos", "grid-photos", "count-photos", photoGroup);
      renderSection("sec-art", "grid-art", "count-art", artGroup);
    })
    .catch(() => {
      empty.hidden = false;
    });
})();
</script>
<script>
(function () {
  var toggle = document.querySelector(".nav-toggle");
  var links = document.getElementById("nav-links");
  if (!toggle || !links) return;
  function close() {
    links.classList.remove("open");
    toggle.classList.remove("is-open");
    toggle.setAttribute("aria-expanded", "false");
  }
  toggle.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = links.classList.toggle("open");
    toggle.classList.toggle("is-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  links.addEventListener("click", function (e) { if (e.target.tagName === "A") close(); });
  document.addEventListener("click", function (e) {
    if (!links.contains(e.target) && !toggle.contains(e.target)) close();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
})();
</script>
</body>
</html>
